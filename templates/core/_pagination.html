{% if page_obj.paginator.num_pages > 1 %}
<nav class="d-flex justify-content-center mt-4" aria-label="Pagination">
    <ul class="pagination pagination-sm">
        {% if page_obj.has_previous %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if status %}&status={{ status }}{% endif %}">Previous</a></li>{% endif %}
        <li class="page-item active"><span class="page-link">{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span></li>
        {% if page_obj.has_next %}<li class="page-item"><a class="page-link" href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q|urlencode }}{% endif %}{% if status %}&status={{ status }}{% endif %}">Next</a></li>{% endif %}
    </ul>
</nav>
{% endif %}
